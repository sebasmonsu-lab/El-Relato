name: Build Sinaiticus Gospel transcriptions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/extract_sinaiticus_gospels.py"
      - "sources/manuscripts/Sinaiticus/transcription/raw/sinaiticus_full_v195.xml"
      - ".github/workflows/build-sinaiticus-gospels.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/extract_sinaiticus_gospels.py
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Commit Gospel transcription layer
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/manuscripts/Sinaiticus/transcription/derived data/normalized/transcriptions data/derived/manuscripts/Sinaiticus-gospel-transcription-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Build normalized Sinaiticus Gospel transcriptions"
            bash scripts/push_generated_commit.sh
          fi
