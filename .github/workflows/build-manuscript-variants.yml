name: Build manuscript transcription variants

on:
  push:
    paths:
      - "scripts/build_manuscript_variants.py"
      - "data/normalized/transcriptions/**"
      - "schemas/variant.schema.json"
      - ".github/workflows/build-manuscript-variants.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build evidence-only verse comparisons
        run: python scripts/build_manuscript_variants.py
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate
        run: python scripts/validate_repo.py
      - name: Commit variants
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/normalized/variants data/derived/variants
          if git diff --cached --quiet; then
            echo "No variant changes."
          else
            git commit -m "Build manuscript verse variants from preserved transcriptions"
            bash scripts/push_generated_commit.sh
          fi
