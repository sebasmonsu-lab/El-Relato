name: Link SBLGNT tokens to Strong and morphology

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/align_sbl_tagnt.py"
      - "data/normalized/sblgnt/**"
      - "data/normalized/stepbible/**"
      - "data/normalized/strong-original/**"
      - "schemas/sbl-tagnt-link.schema.json"
      - ".github/workflows/link-sbl-tagnt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Align SBLGNT with TAGNT
        run: python scripts/align_sbl_tagnt.py

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate linked corpus
        run: python scripts/validate_repo.py

      - name: Commit alignment
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/normalized/links data/derived/alignment
          if git diff --cached --quiet; then
            echo "No alignment changes."
          else
            git commit -m "Link SBLGNT Gospel tokens to TAGNT Strong and morphology"
            bash scripts/push_generated_commit.sh
          fi
