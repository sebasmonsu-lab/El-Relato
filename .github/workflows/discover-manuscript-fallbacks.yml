name: Discover manuscript fallback sources

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/discover_manuscript_fallbacks.py"
      - ".github/workflows/discover-manuscript-fallbacks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Discover institutional fallback links
        run: python scripts/discover_manuscript_fallbacks.py
      - name: Commit discovery capture
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/manuscripts/fallback-discovery data/derived/manuscripts/fallback-source-discovery.json
          if git diff --cached --quiet; then
            echo "No discovery changes."
          else
            git commit -m "Capture manuscript fallback source discovery"
            bash scripts/push_generated_commit.sh
          fi
