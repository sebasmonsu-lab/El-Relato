name: Build El Relato Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_web.py"
      - "scripts/build_gospel_reader.py"
      - "sources/gospel-editions/**"
      - "scripts/build_translation_alignment.py"
      - "scripts/build_query_db.py"
      - "book/**"
      - "data/normalized/**"
      - ".github/workflows/build-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: el-relato-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect translated BOOK editions
        id: book-translations
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import sqlite3
          c=sqlite3.connect("book/el-relato-book.sqlite")
          n=c.execute("""SELECT COUNT(*) FROM editions
                         WHERE lower(language_code) NOT IN ('grc','el','gr')
                           AND lower(status) NOT IN ('generated-partial','superseded','archived')""").fetchone()[0]
          c.close()
          print(f"needs_alignment={'true' if n else 'false'}")
          print(f"translated_editions={n}")
          PY

      - name: Cache multilingual alignment model
        if: steps.book-translations.outputs.needs_alignment == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mbert-simalign-v1

      - name: Cache derived translation alignment
        if: steps.book-translations.outputs.needs_alignment == 'true'
        id: alignment-cache
        uses: actions/cache@v4
        with:
          path: |
            build/translation-alignments.jsonl
            build/translation-alignments-summary.json
          key: translation-alignment-v2-${{ hashFiles('book/el-relato-book.sqlite', 'scripts/build_translation_alignment.py', 'data/normalized/**', 'sources/gospel-editions/**') }}

      - name: Install translation alignment dependencies
        if: steps.book-translations.outputs.needs_alignment == 'true' && steps.alignment-cache.outputs.cache-hit != 'true'
        run: python -m pip install "simalign==0.4"

      - name: Build SOURCE query database
        run: python scripts/build_query_db.py --output build/el-relato.sqlite

      - name: Build translation-to-Greek token alignment
        if: steps.book-translations.outputs.needs_alignment != 'true' || steps.alignment-cache.outputs.cache-hit != 'true'
        env:
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/build_translation_alignment.py \
            --output build/translation-alignments.jsonl \
            --summary build/translation-alignments-summary.json

      - name: Verify cached translation alignment
        if: steps.book-translations.outputs.needs_alignment == 'true' && steps.alignment-cache.outputs.cache-hit == 'true'
        run: |
          test -f build/translation-alignments.jsonl
          test -f build/translation-alignments-summary.json

      - name: Build static research site
        run: python scripts/build_web.py --output build/site

      - name: Build canonical Gospel reader
        run: python scripts/build_gospel_reader.py --site build/site --query-db build/el-relato.sqlite

      - name: Validate W1 plus translation alignment
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          root = Path("build/site")
          m = json.loads((root / "manifest.json").read_text())
          assert m["chapters"] == 6, m
          assert m["scenes"] == 120, m
          assert m["units"] == 4123, m
          assert len(m["editions"]) >= 1, m
          assert m["source_tokens"] > 64000, m
          assert (root / "editions/index.html").exists()

          for e in m["editions"]:
              slug = re.sub(r"[^A-Za-z0-9._-]+", "-", e["edition_id"]).strip("-").lower()
              assert (root / "editions" / slug / "scene/1.html").exists(), e
              assert (root / "editions" / slug / "scene/120.html").exists(), e

          assert (root / "source/matthew/1/1.html").exists()
          assert (root / "source/john/21/25.html").exists()
          assert len(m.get("gospel_editions", [])) >= 1, m
          greek_gospel = next(e for e in m["gospel_editions"] if e["language_code"] == "grc")
          gslug = re.sub(r"[^A-Za-z0-9._-]+", "-", greek_gospel["edition_id"]).strip("-").lower()
          assert (root / "gospels/index.html").exists()
          assert (root / "gospels" / gslug / "matthew/1/index.html").exists()
          assert (root / "gospels" / gslug / "john/21/index.html").exists()
          gospel_reader = (root / "gospels" / gslug / "john/1/index.html").read_text()
          assert 'class="reader"' in gospel_reader, "Gospel chapter is not using continuous reader UX"
          assert 'class="chapter-picker"' in gospel_reader, "Gospel reader has no chapter picker"
          assert 'class="token"' in gospel_reader, "Greek Gospel reader lost token navigation"

          token_pages = list((root / "token").glob("*.html"))
          assert len(token_pages) > 64000, len(token_pages)

          translated = [
              e for e in m["editions"]
              if (e.get("language_code") or "").lower() not in {"grc", "el", "gr"}
          ]
          if translated:
              a = m["translation_alignment"]
              assert a["units"] > 0, a
              assert a["target_tokens"] > 0, a
              assert a["aligned_target_tokens"] > 0, a
              alignment_pages = list((root / "alignment").glob("*/*/*.html"))
              assert len(alignment_pages) == a["target_tokens"], (len(alignment_pages), a)
              first_slug = re.sub(r"[^A-Za-z0-9._-]+", "-", translated[0]["edition_id"]).strip("-").lower()
              scene1 = (root / "editions" / first_slug / "scene/1.html").read_text()
              assert "trans-token" in scene1, "scene 1 has no clickable translated tokens"
              assert "Capa griega subyacente" in scene1, "scene 1 has no Greek layer"

          print("W1 + ALIGNMENT PASS", m)
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
