name: Probe CSNTM manuscript image endpoints

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/probe_csntm_endpoints.py"
      - ".github/workflows/probe-csntm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe pages and client scripts
        run: python scripts/probe_csntm_endpoints.py
      - name: Commit raw probes
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/manuscripts/P4/raw/csntm sources/manuscripts/P45/raw/csntm sources/manuscripts/P52/raw/csntm sources/manuscripts/P66/raw/csntm sources/manuscripts/P104/raw/csntm
          if ! git diff --cached --quiet; then
            git commit -m "Probe CSNTM manuscript image endpoints"
            bash scripts/push_generated_commit.sh
          fi
