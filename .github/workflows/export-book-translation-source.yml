name: Export BOOK translation source
on:
  push:
    branches: [main]
    paths:
      - "scripts/export_book_translation_source.py"
      - ".github/workflows/export-book-translation-source.yml"
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export Greek BOOK units read-only
        run: python scripts/export_book_translation_source.py
      - name: Commit temporary source slices
        run: |
          git config user.name "el-relato-validator"
          git config user.email "actions@users.noreply.github.com"
          git add book/translations/_source-export
          git commit -m "chore(translations): temporary Greek source slices for scenes 57-120" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
