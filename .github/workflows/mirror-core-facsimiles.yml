name: Mirror Vaticanus and Sinaiticus Gospel facsimiles

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/mirror_core_facsimiles.py"
      - ".gitattributes"
      - ".github/workflows/mirror-core-facsimiles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout including existing LFS objects
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Git LFS
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check requests
          git lfs install
          git lfs track "*.jpg"
          git add .gitattributes
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"

      - name: Mirror Vaticanus in checkpoints
        shell: bash
        run: |
          for offset in 0 50 100; do
            python scripts/mirror_core_facsimiles.py --source Vaticanus --offset "$offset" --limit 50
            git add sources/manuscripts/Vaticanus/images/gospels data/manifests/facsimiles/Vaticanus
            if ! git diff --cached --quiet; then
              git commit -m "Mirror Vaticanus Gospel facsimiles batch $offset"
              bash scripts/push_generated_commit.sh
            fi
          done

      - name: Mirror Sinaiticus in checkpoints
        shell: bash
        run: |
          for offset in 0 50 100; do
            python scripts/mirror_core_facsimiles.py --source Sinaiticus-BL --offset "$offset" --limit 50
            git add sources/manuscripts/Sinaiticus/images/gospels data/manifests/facsimiles/Sinaiticus-BL
            if ! git diff --cached --quiet; then
              git commit -m "Mirror Sinaiticus Gospel facsimiles batch $offset"
              bash scripts/push_generated_commit.sh
            fi
          done

      - name: Audit mirrored facsimiles
        shell: bash
        run: |
          python scripts/mirror_core_facsimiles.py --audit
          git add data/derived/manuscripts/core-gospel-facsimile-mirror-summary.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit core Gospel facsimile mirror"
            bash scripts/push_generated_commit.sh
          fi

      - name: Enforce completeness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/derived/manuscripts/core-gospel-facsimile-mirror-summary.json")
          x=json.loads(p.read_text())
          if not x["complete"]:
              raise SystemExit(f"Facsimile mirror incomplete: {x['missing_files']} missing of {x['planned_files']}")
          print(f"Facsimile mirror complete: {x['mirrored_files']} files, {x['total_bytes']} bytes")
          PY
