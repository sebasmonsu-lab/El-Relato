name: Mirror IGNTP papyrus transcriptions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/mirror_igntp_transcriptions.py"
      - ".github/workflows/mirror-igntp-transcriptions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Mirror archived IGNTP TEI transcriptions
        run: python scripts/mirror_igntp_transcriptions.py
      - name: Commit raw transcriptions
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/manuscripts/P52/transcription sources/manuscripts/P66/transcription sources/manuscripts/P75/transcription                   data/derived/manuscripts/igntp-transcription-mirror-summary.json
          if git diff --cached --quiet; then
            echo "No transcription changes."
          else
            git commit -m "Preserve IGNTP transcriptions for P52 P66 P75"
            bash scripts/push_generated_commit.sh
          fi
