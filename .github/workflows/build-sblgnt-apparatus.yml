name: Build SBLGNT edition apparatus

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/parse_sblgnt_apparatus.py"
      - "vendor/SBLGNT/data/sblgntapp/**"
      - "schemas/edition-apparatus-unit.schema.json"
      - ".github/workflows/build-sblgnt-apparatus.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse edition apparatus
        run: python scripts/parse_sblgnt_apparatus.py
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate
        run: python scripts/validate_repo.py
      - name: Commit normalized apparatus
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/normalized/apparatus data/derived/apparatus
          if git diff --cached --quiet; then
            echo "No apparatus changes."
          else
            git commit -m "Build normalized SBLGNT edition apparatus"
            bash scripts/push_generated_commit.sh
          fi
