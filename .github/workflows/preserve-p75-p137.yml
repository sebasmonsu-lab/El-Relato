name: Preserve P75 and P137 primary digital sources

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/harvest_iiif.py"
      - ".github/workflows/preserve-p75-p137.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check requests
          git lfs install
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"

      - name: Preserve P75 IIIF manifest and inventory
        run: |
          python scripts/harvest_iiif.py             --id P75             --url 'https://digi.vatlib.it/iiif/MSS_Pap.Hanna.1(Mater.Verbi)/manifest.json'             --output-dir sources/manuscripts/P75/raw

      - name: Preserve P137 EES edition PDF
        shell: bash
        run: |
          mkdir -p sources/manuscripts/P137/raw
          curl --fail --location --retry 3             'https://www.ees.ac.uk/static/af98dfae-bd9d-4490-8a9971f05a78d610/POxy-LXXXIII-5345-text-and-image.pdf'             -o sources/manuscripts/P137/raw/POxy-LXXXIII-5345-text-and-image.pdf
          sha256sum sources/manuscripts/P137/raw/POxy-LXXXIII-5345-text-and-image.pdf             > sources/manuscripts/P137/raw/SHA256SUMS.txt

      - name: Commit preserved sources
        shell: bash
        run: |
          git add .gitattributes sources/manuscripts/P75/raw sources/manuscripts/P137/raw
          if ! git diff --cached --quiet; then
            git commit -m "Preserve P75 IIIF and P137 EES primary source"
            bash scripts/push_generated_commit.sh
          fi
