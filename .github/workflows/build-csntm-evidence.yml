name: Build integrated manuscript evidence mapping

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "data/derived/manuscripts/csntm-core-mirror-summary.json"
      - "sources/manuscripts/P4/raw/csntm/image-details.jsonl"
      - "sources/manuscripts/P45/raw/csntm/image-details.jsonl"
      - "sources/manuscripts/P52/raw/csntm/image-details.jsonl"
      - "sources/manuscripts/P66/raw/csntm/image-details.jsonl"
      - "sources/manuscripts/P104/raw/csntm/image-details.jsonl"
      - "scripts/build_csntm_evidence_mapping.py"
      - "data/derived/manuscripts/fallback-facsimile-mirror-summary.json"
      - "data/derived/manuscripts/P75-facsimile-summary.json"
      - "data/normalized/transcriptions/**"
      - "sources/manuscripts/P137/raw/**"
      - ".github/workflows/build-csntm-evidence.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_csntm_evidence_mapping.py
      - run: python -m pip install --disable-pip-version-check jsonschema
      - run: python scripts/validate_repo.py
      - name: Commit evidence mappings
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/normalized/manuscript-evidence data/derived/manuscripts/csntm-evidence-mapping-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Build integrated manuscript evidence mapping"
            bash scripts/push_generated_commit.sh
          fi
