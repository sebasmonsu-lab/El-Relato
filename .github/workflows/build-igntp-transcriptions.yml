name: Build IGNTP papyrus transcriptions

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/normalize_igntp_transcriptions.py"
      - "sources/manuscripts/P52/transcription/raw/igntp/**"
      - "sources/manuscripts/P66/transcription/raw/igntp/**"
      - "sources/manuscripts/P75/transcription/raw/igntp/**"
      - ".github/workflows/build-igntp-transcriptions.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize IGNTP TEI
        run: python scripts/normalize_igntp_transcriptions.py
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate
        run: python scripts/validate_repo.py
      - name: Commit normalized transcriptions
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/normalized/transcriptions/igntp-papyri.jsonl data/derived/manuscripts/igntp-normalization-report.json
          if git diff --cached --quiet; then
            echo "No IGNTP normalized changes."
          else
            git commit -m "Build normalized IGNTP P52 P66 P75 transcriptions"
            bash scripts/push_generated_commit.sh
          fi
