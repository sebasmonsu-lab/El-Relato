name: Generate preservation checksums

on:
  push:
    paths:
      - "vendor/**"
      - "sources/**"
      - ".github/workflows/generate-checksums.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SHA-256 manifests
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path

          root = Path(".")
          targets = [Path("vendor"), Path("sources")]
          rows = []
          for base in targets:
              if not base.exists():
                  continue
              for p in sorted(x for x in base.rglob("*") if x.is_file()):
                  data = p.read_bytes()
                  rows.append({
                      "path": p.as_posix(),
                      "sha256": hashlib.sha256(data).hexdigest(),
                      "size": len(data),
                  })

          out = Path("data/checksums")
          out.mkdir(parents=True, exist_ok=True)
          manifest = {
              "generated_at": dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat(),
              "algorithm": "sha256",
              "files": rows,
          }
          (out / "preservation-sha256.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (out / "preservation-sha256.txt").write_text(
              "".join(f"{row['sha256']}  {row['path']}\n" for row in rows),
              encoding="utf-8",
          )
          print(f"Hashed {len(rows)} preserved files.")
          PY

      - name: Commit checksum manifests
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/checksums
          if git diff --cached --quiet; then
            echo "No checksum changes."
          else
            git commit -m "Refresh preservation SHA-256 manifests"
            git push
          fi
