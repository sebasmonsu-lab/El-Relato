name: Harvest CSNTM image passage metadata

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/harvest_csntm_image_details.py"
      - ".github/workflows/harvest-csntm-image-details.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/harvest_csntm_image_details.py
      - name: Commit image metadata
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/manuscripts/P4/raw/csntm sources/manuscripts/P45/raw/csntm sources/manuscripts/P52/raw/csntm sources/manuscripts/P66/raw/csntm sources/manuscripts/P104/raw/csntm
          if ! git diff --cached --quiet; then
            git commit -m "Preserve CSNTM image passage metadata"
            bash scripts/push_generated_commit.sh
          fi
