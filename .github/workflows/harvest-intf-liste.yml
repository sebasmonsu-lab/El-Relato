name: Harvest INTF Gospel witness scope

on:
  push:
    paths:
      - ".github/workflows/harvest-intf-liste.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout El-Relato
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Capture official INTF Liste responses
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          from pathlib import Path
          import requests

          API = "https://ntvmr.uni-muenster.de/community/vmr/api/metadata/liste/search/"
          ROOT = Path("sources/catalogs/INTF-Liste")
          RAW = ROOT / "raw"
          RAW.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({"User-Agent": "El-Relato-research-preservation/1.0"})

          queries = []
          for book in ["Matt", "Mark", "Luke", "John"]:
              queries.append({
                  "name": f"papyri-{book.lower()}",
                  "params": {
                      "indexContent": book,
                      "docID": "10000-19999",
                      "detail": "document",
                      "format": "json",
                      "limit": "10000",
                  },
              })
              queries.append({
                  "name": f"majuscules-through-v-{book.lower()}",
                  "params": {
                      "indexContent": book,
                      "docID": "20000-29999",
                      "dateMax": "599",
                      "detail": "document",
                      "format": "json",
                      "limit": "10000",
                  },
              })

          manifest = {
              "source": "INTF Kurzgefasste Liste / NTVMR",
              "api": API,
              "captured_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "queries": [],
          }

          for q in queries:
              r = session.get(API, params=q["params"], timeout=120)
              r.raise_for_status()
              payload = r.content
              path = RAW / f"{q['name']}.json"
              # Preserve exact HTTP response bytes first.
              path.write_bytes(payload)
              manifest["queries"].append({
                  "name": q["name"],
                  "request_url": r.url,
                  "status_code": r.status_code,
                  "content_type": r.headers.get("Content-Type"),
                  "bytes": len(payload),
                  "sha256": hashlib.sha256(payload).hexdigest(),
                  "local_path": str(path),
              })

          (ROOT / "capture-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit INTF raw catalogue capture
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/catalogs/INTF-Liste
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Capture INTF Liste Gospel witness queries"
            git push
          fi
