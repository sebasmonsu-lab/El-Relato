name: Harvest INTF Gospel witness scope

on:
  push:
    paths:
      - ".github/workflows/harvest-intf-liste.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout El-Relato
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Capture official INTF Liste responses adaptively
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import hashlib
          import json
          import time
          from pathlib import Path
          import requests

          API = "https://ntvmr.uni-muenster.de/community/vmr/api/metadata/liste/search/"
          ROOT = Path("sources/catalogs/INTF-Liste")
          RAW = ROOT / "raw"
          RAW.mkdir(parents=True, exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "El-Relato-research-preservation/1.0",
              "Accept-Encoding": "identity",
          })

          def get(params, timeout=75, attempts=4):
              last = None
              for attempt in range(1, attempts + 1):
                  try:
                      r = session.get(API, params=params, timeout=timeout)
                      r.raise_for_status()
                      return r
                  except Exception as exc:
                      last = exc
                      if attempt < attempts:
                          time.sleep(2 ** (attempt - 1))
              raise last

          def extract_count(payload):
              try:
                  obj = json.loads(payload)
              except Exception:
                  return None
              if isinstance(obj, int):
                  return obj
              if isinstance(obj, list):
                  return len(obj)
              if isinstance(obj, dict):
                  for key in ("count", "total", "totalCount", "resultCount", "documentCount"):
                      val = obj.get(key)
                      if isinstance(val, int):
                          return val
                      if isinstance(val, str) and val.isdigit():
                          return int(val)
                  # Search one level deeper for a conventional count key.
                  for val in obj.values():
                      if isinstance(val, dict):
                          for key in ("count", "total", "totalCount", "resultCount", "documentCount"):
                              n = val.get(key)
                              if isinstance(n, int):
                                  return n
                              if isinstance(n, str) and n.isdigit():
                                  return int(n)
              return None

          manifest = {
              "source": "INTF Kurzgefasste Liste / NTVMR",
              "api": API,
              "captured_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "method": "adaptive docID range subdivision; broad count probes, then document-level captures",
              "scope": {
                  "papyri": "all docIDs 10000-19999 containing Matt/Mark/Luke/John",
                  "majuscules": "all docIDs 20000-29999 containing Matt/Mark/Luke/John with dateMax=499",
              },
              "captures": [],
          }

          def capture_range(book, kind, lo, hi, extra):
              base = {
                  "indexContent": book,
                  "docID": f"{lo}-{hi}",
                  "format": "json",
                  **extra,
              }

              # Fast count probe. If INTF does not expose a parseable count,
              # recursively subdivide by docID until the range is small.
              count_params = {**base, "detail": "count"}
              count_resp = get(count_params, timeout=45)
              count = extract_count(count_resp.content)

              # Empty count is definitive.
              if count == 0:
                  return

              width = hi - lo + 1
              should_split = (count is None and width > 100) or (count is not None and count > 30 and width > 25)

              if should_split:
                  mid = (lo + hi) // 2
                  capture_range(book, kind, lo, mid, extra)
                  capture_range(book, kind, mid + 1, hi, extra)
                  return

              params = {**base, "detail": "document", "limit": "250"}
              try:
                  r = get(params, timeout=90)
              except requests.exceptions.ReadTimeout:
                  if width <= 1:
                      raise
                  mid = (lo + hi) // 2
                  capture_range(book, kind, lo, mid, extra)
                  capture_range(book, kind, mid + 1, hi, extra)
                  return

              name = f"{kind}-{book.lower()}-{lo}-{hi}.json"
              path = RAW / name
              path.write_bytes(r.content)
              manifest["captures"].append({
                  "book": book,
                  "kind": kind,
                  "docID_range": f"{lo}-{hi}",
                  "count_probe": count,
                  "request_url": r.url,
                  "status_code": r.status_code,
                  "content_type": r.headers.get("Content-Type"),
                  "bytes": len(r.content),
                  "sha256": hashlib.sha256(r.content).hexdigest(),
                  "local_path": str(path),
              })

          for book in ["Matt", "Mark", "Luke", "John"]:
              capture_range(book, "papyri", 10000, 19999, {})
              capture_range(book, "majuscules-through-v", 20000, 29999, {"dateMax": "499"})

          (ROOT / "capture-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Captured {len(manifest['captures'])} non-empty/raw INTF result blocks")
          PY

      - name: Commit INTF raw catalogue capture
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add sources/catalogs/INTF-Liste
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Capture INTF Liste Gospel witness queries"
            git push
          fi
