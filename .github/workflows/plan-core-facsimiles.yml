name: Plan core Gospel facsimile mirror

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    paths:
      - "scripts/plan_core_facsimiles.py"
      - "sources/manuscripts/Vaticanus/raw/iiif-canvases.jsonl"
      - "sources/manuscripts/Sinaiticus/raw/british-library/iiif-canvases.jsonl"
      - ".github/workflows/plan-core-facsimiles.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Select Gospel canvases and probe full-image sizes
        run: python scripts/plan_core_facsimiles.py --probe-sizes
      - name: Commit facsimile plan
        shell: bash
        run: |
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/derived/manuscripts/core-gospel-facsimile-plan.jsonl data/derived/manuscripts/core-gospel-facsimile-summary.json
          if git diff --cached --quiet; then
            echo "No facsimile-plan changes."
          else
            git commit -m "Plan and size Vaticanus and Sinaiticus Gospel facsimiles"
            bash scripts/push_generated_commit.sh
          fi
