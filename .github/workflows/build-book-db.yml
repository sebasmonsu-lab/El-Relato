name: Build El Relato Book DB\n# Produces canonical SQLite plus inspectable JSONL exports.

on:
  push:
    branches: [main]
    paths:
      - "book/data/**"
      - "book/schema.sql"
      - "scripts/build_book_db.py"
      - "scripts/apply_tk_es419.py"
      - "book/translations/tk-es-419/**"
      - "data/normalized/sblgnt/edition-verses.jsonl"
      - "data/normalized/sblgnt/tokens.jsonl"
      - ".github/workflows/build-book-db.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-el-relato-book-db-main
  cancel-in-progress: false

jobs:
  build-book-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SQLite
        run: python scripts/build_book_db.py

      - name: Apply TK es-419 V0.1 pilot
        run: python scripts/apply_tk_es419.py

      - name: Verify SQLite
        run: |
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("book/el-relato-book.sqlite")
          expected = {"chapters": 6, "scenes": 120, "units": 4123, "unit_witnesses": 5381}
          for table, n in expected.items():
              got = db.execute(f"select count(*) from {table}").fetchone()[0]
              assert got == n, (table, got, n)
          baseline = "edition:el-relato:grc-sblgnt-2010:v1"
          baseline_texts = db.execute("select count(*) from unit_texts where edition_id=?", (baseline,)).fetchone()[0]
          assert baseline_texts == 4123, baseline_texts
          stats = dict(db.execute("select metric, value from build_stats"))
          unresolved = int(stats.get("unresolved_witnesses", "0"))
          missing = db.execute("select count(*) from unit_texts where text is null or trim(text)='' ").fetchone()[0]
          issues = db.execute("select count(*) from validation_issues where severity='ERROR'").fetchone()[0]
          fk = db.execute("pragma foreign_key_check").fetchall()
          if unresolved or issues or missing:
              print("validation_issues")
              for row in db.execute("select unit_id, reference_component, code, message from validation_issues order by issue_id"):
                  print(row)
          assert unresolved == 0, stats
          assert missing == 0, missing
          assert issues == 0, issues
          assert not fk, fk[:10]
          print("PASS", expected)
          print("build_stats", stats)
          print("unresolved_witnesses=0 missing_primary_texts=0 validation_errors=0")
          es419 = "edition:el-relato:tk-es-419:v0.1"
          translated = db.execute("select count(*) from unit_texts where edition_id=?", (es419,)).fetchone()[0]
          audit = db.execute("select count(*) from translation_unit_audit where edition_id=?", (es419,)).fetchone()[0]
          run = db.execute("select units_generated, status from translation_runs where edition_id=?", (es419,)).fetchone()
          assert translated == 349, translated
          assert audit == 349, audit
          assert run == (349, "generated-pilot"), run
          print("TK-es-419 PASS translated_units=349 audit_rows=349 scenes=1-10 status=generated-pilot")
          db.close()
          PY

      - name: Commit generated DB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book/el-relato-book.sqlite book/exports/ book/translations/tk-es-419/build-report.json
          if git diff --cached --quiet; then
            echo "Database unchanged."
            exit 0
          fi
          git commit -m "build(book): generate Greek book database v1"
          bash scripts/push_generated_commit.sh
