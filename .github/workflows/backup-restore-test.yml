name: Backup and restore test

on:
  push:
    paths:
      - "backup/**"
      - "scripts/validate_repo.py"
      - "scripts/build_query_db.py"
      - "app/**"
      - ".github/workflows/backup-restore-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create complete Git bundle
        run: bash backup/create_bundle.sh
      - name: Verify restoration from bundle only
        run: bash backup/verify_restore.sh build/backups/el-relato.bundle
      - name: Persist successful restore report
        shell: bash
        run: |
          mkdir -p data/derived/backup
          python - <<'PY'
          import json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          meta=json.loads(Path("build/backups/backup-metadata.json").read_text())
          report={
            "tested_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            "head": subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "restore_test":"PASS",
            "git_fsck":"PASS",
            "git_lfs_fsck":"PASS",
            "repository_validation":"PASS",
            "query_database_rebuild":"PASS",
            "app_self_test":"PASS",
            "bundle_bytes":meta.get("bundle_bytes"),
            "lfs_archive_bytes":meta.get("lfs_archive_bytes"),
            "lfs_tracked_entries":meta.get("lfs_tracked_entries"),
          }
          Path("data/derived/backup/backup-test-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
          git config user.name "El-Relato Bot"
          git config user.email "el-relato-bot@users.noreply.github.com"
          git add data/derived/backup/backup-test-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Record successful offline Git plus LFS restore test"
            bash scripts/push_generated_commit.sh
          fi

      - name: Split LFS archive for connector-safe off-GitHub transfer
        shell: bash
        run: |
          mkdir -p build/backups/chunks
          split -b 90M -d -a 2 build/backups/el-relato-lfs.tar build/backups/chunks/el-relato-lfs.tar.part-
          sha256sum build/backups/chunks/el-relato-lfs.tar.part-* > build/backups/chunks/SHA256SUMS.txt
          ls -lh build/backups/chunks

      - name: Upload Git bundle metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: el-relato-backup-bundle
          path: |
            build/backups/el-relato.bundle
            build/backups/el-relato.bundle.sha256
            build/backups/el-relato-lfs.tar.sha256
            build/backups/backup-metadata.json
            build/backups/chunks/SHA256SUMS.txt
          retention-days: 7
          compression-level: 0

      - name: Upload LFS chunk 00
        uses: actions/upload-artifact@v4
        with:
          name: el-relato-lfs-part-00
          path: build/backups/chunks/el-relato-lfs.tar.part-00
          retention-days: 7
          compression-level: 0
      - name: Upload LFS chunk 01
        uses: actions/upload-artifact@v4
        with:
          name: el-relato-lfs-part-01
          path: build/backups/chunks/el-relato-lfs.tar.part-01
          retention-days: 7
          compression-level: 0
      - name: Upload LFS chunk 02
